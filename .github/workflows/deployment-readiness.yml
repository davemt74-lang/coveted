name: Production Deployment Readiness

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint deployment readiness PHP
        run: |
          php -l app/deployment.php
          php -l scripts/preflight.php
          php -l scripts/verify-deployment-readiness.php

      - name: Verify deployment readiness contract
        run: php scripts/verify-deployment-readiness.php
