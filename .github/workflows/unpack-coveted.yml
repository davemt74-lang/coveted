name: Unpack Coveted Deploy

on:
  push:
    branches:
      - fix/admin-http-500
    paths:
      - '.github/workflows/unpack-coveted.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/unpack-coveted.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/admin-http-500
          fetch-depth: 0

      - name: Unpack latest Coveted deploy
        shell: bash
        run: |
          set -euo pipefail
          ZIP='coveted-deploy-http500-fixed.zip'
          test -f "$ZIP"
          rm -rf .unpack
          mkdir .unpack
          unzip -q "$ZIP" -d .unpack
          echo 'Top-level extracted contents:'
          find .unpack -maxdepth 2 -type f | head -80

          shopt -s dotglob nullglob
          entries=(.unpack/*)
          if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
            src="${entries[0]}"
          else
            src='.unpack'
          fi

          for item in "$src"/*; do
            base="$(basename "$item")"
            case "$base" in
              .git|.github|coveted-deploy-http500-fixed.zip|'software-deploy (1).zip') continue ;;
            esac
            rm -rf "$base"
            cp -a "$item" "$base"
          done
          rm -rf .unpack

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No extracted source changes to commit.'
            exit 0
          fi
          git commit -m 'Unpack latest Coveted deploy source'
          git push origin HEAD:fix/admin-http-500
