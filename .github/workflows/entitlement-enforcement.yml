name: Entitlement Enforcement & Upgrade UX

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint entitlement enforcement PHP
        run: |
          php -l app/entitlement_access.php
          php -l app/rewards.php
          php -l app/campaigns.php
          php -l business.php
          php -l scripts/verify-entitlement-enforcement.php

      - name: Verify entitlement enforcement contract
        run: php scripts/verify-entitlement-enforcement.php
