name: Member Relationship Actions

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint Member Relationship Actions PHP
        run: |
          php -l app/member_relationship_actions.php
          php -l admin/member-actions.php
          php -l scripts/verify-member-relationship-actions.php

      - name: Verify Member Relationship Actions contract
        run: php scripts/verify-member-relationship-actions.php
