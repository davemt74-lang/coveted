name: Temporary Deploy Package

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-deploy-package.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Build deploy ZIP
        run: |
          rm -f coveted-deploy.zip
          zip -r coveted-deploy.zip . \
            -x '.git/*' \
               '.github/*' \
               'coveted-deploy.zip'
          unzip -t coveted-deploy.zip
      - name: Publish temporary deploy ZIP on packaging branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f coveted-deploy.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Publish temporary deploy ZIP'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Upload deploy ZIP
        uses: actions/upload-artifact@v4
        with:
          name: coveted-deploy
          path: coveted-deploy.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
