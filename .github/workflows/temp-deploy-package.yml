name: Temporary Deploy Package

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-deploy-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build deploy ZIP
        run: |
          rm -f coveted-deploy.zip
          zip -r coveted-deploy.zip . \
            -x '.git/*' \
               '.github/*' \
               'coveted-deploy.zip'
          unzip -t coveted-deploy.zip
      - name: Upload deploy ZIP
        uses: actions/upload-artifact@v4
        with:
          name: coveted-deploy
          path: coveted-deploy.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
