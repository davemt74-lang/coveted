name: Personal Member Concierge

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint Concierge PHP
        run: |
          php -l app/member_concierge.php
          php -l api/account-agent-bootstrap.php
          php -l api/account-agent-chat.php
          php -l api/account-agent-action.php
          php -l scripts/verify-member-concierge.php

      - name: Verify Personal Member Concierge contract
        run: php scripts/verify-member-concierge.php

      - name: Verify persistent Agent shell JavaScript syntax
        run: node --check assets/js/account-agent-shell-v1.js
