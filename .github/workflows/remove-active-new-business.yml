name: Remove Active New Business Tab

on:
  push:
    branches:
      - fix/remove-active-new-business

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/remove-active-new-business
          fetch-depth: 0

      - name: Remove New Business tab and dead tab view
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('business.php')
          text = path.read_text()

          old = """$tabs = [\n    'overview' => 'Overview',\n    'locations' => 'Locations',\n    'rewards' => 'Rewards',\n    'campaigns' => 'Campaigns',\n    'claims' => 'Claims',\n    'insights' => 'Insights',\n    'admins' => 'Admins',\n];\nif ($isSystemAdmin) {\n    $tabs['new'] = 'New Business';\n}\n"""
          new = """$tabs = [\n    'overview' => 'Overview',\n    'locations' => 'Locations',\n    'rewards' => 'Rewards',\n    'campaigns' => 'Campaigns',\n    'claims' => 'Claims',\n    'insights' => 'Insights',\n    'admins' => 'Admins',\n];\n"""
          if old not in text:
              raise SystemExit('Expected tabs block not found')
          text = text.replace(old, new, 1)

          text = text.replace("$tab === 'new' ? 'overview' : $tab", "$tab", 1)

          start = text.find("<?php if ($tab === 'new' && $isSystemAdmin): ?>")
          if start == -1:
              raise SystemExit('Expected New Business tab section not found')
          end_marker = "<?php endif; ?>\n\n<?php if ($tab === 'locations'): ?>"
          end = text.find(end_marker, start)
          if end == -1:
              raise SystemExit('Expected end of New Business section not found')
          text = text[:start] + "<?php if ($tab === 'locations'): ?>" + text[end + len(end_marker):]

          path.write_text(text)
          PY

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Verify business.php
        run: |
          php -l business.php
          ! grep -q "tabs\['new'\]" business.php
          ! grep -q "tab === 'new'" business.php

      - name: Commit product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business.php
          git commit -m "Remove New Business tab from active business workspace"
          git push origin HEAD:fix/remove-active-new-business
