name: Apply Admin-Owned Event Authority

on:
  push:
    branches:
      - fix/admin-owned-event-authority

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/admin-owned-event-authority
          fetch-depth: 0

      - name: Normalize temporary patch matcher
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-admin-owned-event-authority.py')
          text = p.read_text()
          old = """    (r\"(function coveted_event_add_mystery_reveal\\(\\n    array \\$actor,\\n    string \\$eventRef,\\n    string \\$revealAt,\\n    string \\$revealType,\\n    string \\$title,\\n    string \\$content\\n\\): void \\{)\", \"mystery reveal\"),"""
          new = """    (r\"(function coveted_event_add_mystery_reveal\\([\\s\\S]*?\\): int\\s*\\{)\", \"mystery reveal\"),"""
          if old not in text:
              raise SystemExit('Temporary mystery matcher source not found')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Apply authority patch
        run: python3 scripts/apply-admin-owned-event-authority.py

      - name: Fix verifier literals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify-event-authority.php')
          text = p.read_text()
          replacements = {
              'function coveted_event_create(array $actor, int $groupId, array $data): array\\n{\\n    coveted_event_require_system_admin($actor);': 'function coveted_event_create(array \\$actor, int \\$groupId, array \\$data): array\\n{\\n    coveted_event_require_system_admin(\\$actor);',
              'function coveted_event_set_status(array $actor, string $eventRef, string $status): void\\n{\\n    coveted_event_require_system_admin($actor);': 'function coveted_event_set_status(array \\$actor, string \\$eventRef, string \\$status): void\\n{\\n    coveted_event_require_system_admin(\\$actor);',
              'function coveted_event_assign_host(array $actor, string $eventRef, int $userId, string $hostRole): void\\n{\\n    coveted_event_require_system_admin($actor);': 'function coveted_event_assign_host(array \\$actor, string \\$eventRef, int \\$userId, string \\$hostRole): void\\n{\\n    coveted_event_require_system_admin(\\$actor);',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit('Verifier authority string not found: ' + old)
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Verify authority patch
        shell: bash
        run: |
          php -l app/events.php
          php -l app/event_management.php
          php -l host.php
          php -l events.php
          php -l group.php
          php -l scripts/verify-event-authority.php
          php scripts/verify-event-authority.php

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/events.php app/event_management.php host.php events.php group.php scripts/verify-event-authority.php .github/workflows/php-lint.yml
          git commit -m "Make event creation and configuration Admin-owned"
          git push origin HEAD:fix/admin-owned-event-authority
