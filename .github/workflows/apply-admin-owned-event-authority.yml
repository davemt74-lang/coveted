name: Apply Admin-Owned Event Authority

on:
  push:
    branches:
      - fix/admin-owned-event-authority

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/admin-owned-event-authority
          fetch-depth: 0

      - name: Apply check-in access patch
        run: python3 scripts/fix-checkin-assignment-access.py

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Verify product and authority contract
        run: |
          php -l host.php
          php -l events.php
          php -l scripts/verify-event-authority.php
          php scripts/verify-event-authority.php

      - name: Commit follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add host.php events.php scripts/verify-event-authority.php
          git commit -m "Allow assigned check-in staff into Host Workspace"
          git push origin HEAD:fix/admin-owned-event-authority
