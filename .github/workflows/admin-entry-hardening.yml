name: Harden Coveted Admin Entry

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/admin-entry-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    if: github.head_ref == 'fix/admin-entry-hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: fix/admin-entry-hardening
          fetch-depth: 0

      - name: Patch Admin recovery path
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'Expected one replacement for {label}, got {count}')
              return updated

          admin_ui = Path('app/admin_ui.php')
          text = admin_ui.read_text()
          pattern = r"function coveted_admin_ui_counts\(\?PDO \$pdo = null\): array\n\{.*?\n\}\n\nfunction coveted_admin_ui_initials"
          replacement = '''function coveted_admin_ui_safe_count(PDO $pdo, string $sql, string $label): int
          {
              try {
                  return (int)$pdo->query($sql)->fetchColumn();
              } catch (Throwable $e) {
                  error_log('Coveted Admin count unavailable [' . $label . ']: ' . $e->getMessage());
                  return 0;
              }
          }

          function coveted_admin_ui_counts(?PDO $pdo = null): array
          {
              $pdo ??= coveted_db();

              return [
                  'users' => coveted_admin_ui_safe_count($pdo, "SELECT COUNT(*) FROM users WHERE status <> 'deleted'", 'users'),
                  'groups' => coveted_admin_ui_safe_count($pdo, "SELECT COUNT(*) FROM social_groups WHERE status <> 'archived'", 'groups'),
                  'events' => coveted_admin_ui_safe_count($pdo, "SELECT COUNT(*) FROM events WHERE status <> 'cancelled'", 'events'),
                  'businesses' => coveted_admin_ui_safe_count($pdo, "SELECT COUNT(*) FROM businesses WHERE status <> 'archived'", 'businesses'),
                  'artists' => coveted_admin_ui_safe_count($pdo, "SELECT COUNT(*) FROM artist_profiles WHERE status <> 'archived'", 'artists'),
                  'pending_requests' => coveted_admin_ui_safe_count($pdo, "SELECT COUNT(*) FROM role_requests WHERE status = 'pending'", 'pending_requests'),
              ];
          }

          function coveted_admin_ui_initials'''
          text = replace_once(text, pattern, replacement, 'admin UI counts', re.S)
          admin_ui.write_text(text)

          onboarding = Path('app/admin_onboarding.php')
          text = onboarding.read_text()
          pattern = r"function coveted_admin_onboarding_state\(array \$admin\): array\n\{.*?\n\}\n\nfunction coveted_admin_should_show_onboarding\(array \$admin\): bool\n\{.*?\n\}\n"
          replacement = '''function coveted_admin_onboarding_safe_count(PDO $pdo, string $sql, string $label, array &$issues): int
          {
              try {
                  return (int)$pdo->query($sql)->fetchColumn();
              } catch (Throwable $e) {
                  $issues[] = $label;
                  error_log('Coveted Admin onboarding data unavailable [' . $label . ']: ' . $e->getMessage());
                  return 0;
              }
          }

          function coveted_admin_onboarding_state(array $admin): array
          {
              if (!coveted_is_system_admin($admin)) {
                  throw new InvalidArgumentException('System Admin access is required.');
              }

              $pdo = coveted_db();
              $issues = [];
              $counts = [
                  'users' => coveted_admin_onboarding_safe_count($pdo, "SELECT COUNT(*) FROM users WHERE status <> 'deleted'", 'users', $issues),
                  'businesses' => coveted_admin_onboarding_safe_count($pdo, "SELECT COUNT(*) FROM businesses WHERE status <> 'archived'", 'businesses', $issues),
                  'groups' => coveted_admin_onboarding_safe_count($pdo, "SELECT COUNT(*) FROM social_groups WHERE status <> 'archived'", 'groups', $issues),
                  'events' => coveted_admin_onboarding_safe_count($pdo, "SELECT COUNT(*) FROM events WHERE status <> 'cancelled'", 'events', $issues),
                  'invitations' => coveted_admin_onboarding_safe_count($pdo, "SELECT COUNT(*) FROM event_invitations WHERE status <> 'revoked'", 'invitations', $issues),
              ];

              $steps = [
                  [
                      'key' => 'business',
                      'title' => 'Create your first business',
                      'description' => 'Add a venue or partner that can host experiences and member benefits.',
                      'href' => '/admin/?view=businesses#create-business',
                      'done' => $counts['businesses'] > 0,
                  ],
                  [
                      'key' => 'group',
                      'title' => 'Create your first group',
                      'description' => 'Create the private community that will receive invitations and experiences.',
                      'href' => '/admin/?view=groups#create-group',
                      'done' => $counts['groups'] > 0,
                  ],
                  [
                      'key' => 'user',
                      'title' => 'Add a host or member',
                      'description' => 'Create another account and give it only the access it actually needs.',
                      'href' => '/admin/?view=users#create-user',
                      'done' => $counts['users'] > 1,
                  ],
                  [
                      'key' => 'event',
                      'title' => 'Create your first event',
                      'description' => 'Build a gathering inside a group, then publish it when it is ready.',
                      'href' => '/admin/?view=events#create-event',
                      'done' => $counts['events'] > 0,
                  ],
                  [
                      'key' => 'invite',
                      'title' => 'Invite attendees',
                      'description' => 'Send at least one event invitation so you can verify the member flow end-to-end.',
                      'href' => '/admin/?view=events',
                      'done' => $counts['invitations'] > 0,
                  ],
              ];

              $completed = count(array_filter($steps, static fn(array $step): bool => $step['done']));
              $total = count($steps);
              $dismissed = false;

              try {
                  $dismissedStmt = $pdo->prepare(
                      "SELECT 1
                       FROM audit_events
                       WHERE actor_user_id = ?
                         AND event_type = 'admin.onboarding_dismissed'
                       ORDER BY id DESC
                       LIMIT 1"
                  );
                  $dismissedStmt->execute([(int)$admin['id']]);
                  $dismissed = (bool)$dismissedStmt->fetchColumn();
              } catch (Throwable $e) {
                  $issues[] = 'audit_events';
                  error_log('Coveted Admin onboarding dismissal state unavailable: ' . $e->getMessage());
              }

              return [
                  ...$counts,
                  'completed' => $completed,
                  'total' => $total,
                  'percent' => $total > 0 ? (int)round(($completed / $total) * 100) : 100,
                  'is_complete' => $completed === $total,
                  'is_dismissed' => $dismissed,
                  'has_data_issues' => $issues !== [],
                  'data_issues' => array_values(array_unique($issues)),
                  'steps' => $steps,
              ];
          }

          function coveted_admin_should_show_onboarding(array $admin): bool
          {
              $state = coveted_admin_onboarding_state($admin);
              return !$state['has_data_issues'] && !$state['is_complete'] && !$state['is_dismissed'];
          }
          '''
          text = replace_once(text, pattern, replacement, 'admin onboarding state', re.S)
          onboarding.write_text(text)

          admin_index = Path('admin/index.php')
          text = admin_index.read_text()

          pattern = r"\$countStmt = \$pdo->query\(\n    \"SELECT\n        \(SELECT COUNT\(\*\) FROM users\) AS users,\n        \(SELECT COUNT\(\*\) FROM social_groups\) AS groups,\n        \(SELECT COUNT\(\*\) FROM events\) AS events,\n        \(SELECT COUNT\(\*\) FROM businesses\) AS businesses,\n        \(SELECT COUNT\(\*\) FROM artist_profiles\) AS artists,\n        \(SELECT COUNT\(\*\) FROM role_requests WHERE status = 'pending'\) AS pending_requests\"\n\);\n\$counts = \$countStmt->fetch\(\) \?: \[\n    'users' => 0,\n    'groups' => 0,\n    'events' => 0,\n    'businesses' => 0,\n    'artists' => 0,\n    'pending_requests' => 0,\n\];"
          text = replace_once(text, pattern, "$counts = coveted_admin_ui_counts($pdo);", 'admin count query')

          first_loader = "if ($view === 'requests' || $view === 'dashboard') {"
          if first_loader not in text:
              raise SystemExit('Could not find first Admin data loader')
          text = text.replace(first_loader, "try {\n" + first_loader, 1)

          marker = "\n\ncoveted_page_start('Admin', '', true);"
          if marker not in text:
              raise SystemExit('Could not find Admin page render marker')
          recovery = '''
          } catch (Throwable $e) {
              $adminLoadMessage = trim(preg_replace('/\\s+/', ' ', $e->getMessage()) ?? $e->getMessage());
              error_log('Coveted Admin recovery mode: ' . $adminLoadMessage);
              if ($error === '') {
                  $error = 'Admin opened in recovery mode because some data could not load: ' . $adminLoadMessage;
              }
          }

          coveted_page_start('Admin', '', true);'''
          text = text.replace(marker, "\n" + recovery, 1)
          admin_index.write_text(text)

          old_unpack = Path('.github/workflows/unpack-coveted.yml')
          if old_unpack.exists():
              old_unpack.unlink()

      - name: Lint Admin PHP
        run: |
          set -euo pipefail
          php -v
          find admin app -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          tail -20 /tmp/php-lint.log

      - name: Commit hardened source
        run: |
          set -euo pipefail
          rm -f .github/workflows/admin-entry-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden Admin entry against data bootstrap failures'
          git push origin HEAD:fix/admin-entry-hardening
