name: Membership Lifecycle CRM

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint Membership Lifecycle CRM PHP
        run: |
          php -l app/membership_lifecycle.php
          php -l app/admin_agent_brain.php
          php -l app/admin_agent_actions.php
          php -l app/member_concierge.php
          php -l admin/membership-lifecycle.php
          php -l admin/member-journeys.php
          php -l admin/member-relationships.php
          php -l scripts/verify-membership-lifecycle.php

      - name: Verify Membership Lifecycle CRM contract
        run: php scripts/verify-membership-lifecycle.php
