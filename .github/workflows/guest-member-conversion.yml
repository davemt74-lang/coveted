name: Guest Member Conversion

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint Guest Member Conversion PHP
        run: |
          php -l app/guest_member_conversion.php
          php -l admin/guest-conversions.php
          php -l app/operations.php
          php -l admin/operations.php
          php -l app/admin_agent_brain.php
          php -l app/admin_ui.php
          php -l app/member_journey.php
          php -l admin/member-journeys.php
          php -l scripts/verify-guest-member-conversion.php

      - name: Verify Guest Member Conversion contract
        run: php scripts/verify-guest-member-conversion.php