name: PHP Source Lint

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint application PHP
        shell: bash
        run: |
          set -u
          failed=0
          while IFS= read -r -d '' file; do
            if ! output=$(php -l "$file" 2>&1); then
              printf '%s\n' "$output"
              failed=1
            fi
          done < <(find . \
            -path './vendor' -prune -o \
            -path './.git' -prune -o \
            -type f -name '*.php' -print0)
          exit "$failed"

      - name: Verify event authority contract
        run: php scripts/verify-event-authority.php

      - name: Verify Business / Location Host workspace contract
        run: php scripts/verify-business-host-workspace.php

      - name: Verify Attendee Event Experience contract
        run: php scripts/verify-attendee-event-workspace.php

      - name: Verify Attendee Event navigation JavaScript syntax
        run: node --check assets/js/attendee-event-nav-v1.js

      - name: Verify Event Lifecycle Automation contract
        run: php scripts/verify-event-lifecycle-automation.php

      - name: Verify Admin Event Workspace contract
        run: php scripts/verify-admin-event-workspace.php

      - name: Verify Admin Agent contract
        run: php scripts/verify-admin-agent.php

      - name: Verify Admin Agent briefing contract
        run: php scripts/verify-admin-agent-briefing.php

      - name: Verify Admin CRM intelligence contract
        run: php scripts/verify-admin-crm-intelligence.php

      - name: Verify CRM intelligence JavaScript syntax
        run: node --check assets/js/invite-crm-v2.js

      - name: Verify Admin Agent live business analytics contract
        run: php scripts/verify-admin-agent-live-business.php

      - name: Verify Admin Agent live business JavaScript syntax
        run: node --check assets/js/admin-agent-live-business-v1.js

      - name: Verify Admin Agent task queue contract
        run: php scripts/verify-admin-agent-task-queue.php

      - name: Verify Admin Agent task queue JavaScript syntax
        run: node --check assets/js/admin-agent-task-queue-v1.js

      - name: Verify Admin Agent approved task execution contract
        run: php scripts/verify-admin-agent-task-execution.php

      - name: Verify Admin Agent approved task execution JavaScript syntax
        run: node --check assets/js/admin-agent-task-execution-v1.js

      - name: Verify member sample-data contract
        run: php scripts/verify-member-sample-data.php

      - name: Verify Admin v2 integrity contract
        run: php scripts/verify-admin-integrity.php

      - name: Verify landing sample event image contract
        run: php scripts/verify-landing-sample-images.php

      - name: Verify invite CRM and city contract
        run: php scripts/verify-invite-crm.php

      - name: Verify newsletter CRM contract
        run: php scripts/verify-newsletter-crm.php

      - name: Verify invite profile edge contract
        run: php scripts/verify-invite-profile-edgecases.php

      - name: Verify landing network and nationwide city contract
        run: php scripts/verify-landing-network.php
