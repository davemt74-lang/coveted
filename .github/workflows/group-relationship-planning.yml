name: Group Relationship Planning

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint Group Relationship Planning PHP
        run: |
          php -l app/group_relationship_planning.php
          php -l admin/group-relationship-planning.php
          php -l app/event_opportunities.php
          php -l scripts/verify-group-relationship-planning.php

      - name: Verify Group Relationship Planning contract
        run: php scripts/verify-group-relationship-planning.php
