name: Fix PHP 8.1 Business Compatibility

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/fix-business-php81.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/admin-entry-hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/admin-entry-hardening
          fetch-depth: 0

      - name: Replace PHP 8.2-only never arrow closure
        shell: python
        run: |
          from pathlib import Path

          path = Path('business.php')
          text = path.read_text()
          old = '''        $return = static fn(string $targetTab, string $saved): never => coveted_redirect(
              '/business.php?business=' . rawurlencode($businessRef)
              . '&tab=' . rawurlencode($targetTab)
              . '&saved=' . rawurlencode($saved)
          );'''
          new = '''        $return = static function (string $targetTab, string $saved) use ($businessRef): never {
              coveted_redirect(
                  '/business.php?business=' . rawurlencode($businessRef)
                  . '&tab=' . rawurlencode($targetTab)
                  . '&saved=' . rawurlencode($saved)
              );
          };'''
          if old not in text:
              raise SystemExit('Expected business redirect closure was not found')
          path.write_text(text.replace(old, new, 1))

      - name: Verify PHP 8.1 syntax
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Lint changed file
        run: php -l business.php

      - name: Commit patch and remove temporary workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-business-php81.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make business redirect closure PHP 8.1 compatible'
          git push origin HEAD:fix/admin-entry-hardening
