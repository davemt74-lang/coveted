name: Admin Partner Activation Patch

on:
  push:
    branches:
      - feature/entitlement-enforcement-upgrade-ux

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Bootstrap Admin partner activation fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/entitlement-enforcement-upgrade-ux
          fetch-depth: 0
      - name: Activate prospective partners on current Admin package grants
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('app/service_packages.php')
          s = p.read_text()
          old = "    if (!$package || (int)$package['is_active'] !== 1) {\n        throw new InvalidArgumentException('Choose an active service package.');\n    }\n    $start = $startsAt !== null"
          new = "    if (!$package || (int)$package['is_active'] !== 1) {\n        throw new InvalidArgumentException('Choose an active service package.');\n    }\n    $packageEntitlements = coveted_service_entitlements_for_package($packageId, $pdo);\n    $partnerWorkspaceValue = strtolower(trim((string)($packageEntitlements['partner.workspace'] ?? '')));\n    $packageActivatesPartner = $scope['scope_type'] === 'business'\n        && !in_array($partnerWorkspaceValue, ['', '0', 'false', 'off', 'no'], true);\n    $start = $startsAt !== null"
          if s.count(old) != 1:
              raise SystemExit(f'package activation setup anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = "        coveted_audit(\n            'service_package.assigned',"
          new = "        $assignmentActiveNow = ($start === null || strtotime($start) <= time())\n            && ($end === null || strtotime($end) > time());\n        if ($packageActivatesPartner && $assignmentActiveNow && (int)($scope['business_id'] ?? 0) > 0) {\n            $activate = $pdo->prepare(\"UPDATE businesses SET status='active',updated_at=NOW() WHERE id=? AND status='prospective'\");\n            $activate->execute([(int)$scope['business_id']]);\n            if ($activate->rowCount() === 1) {\n                coveted_audit(\n                    'partner.activated_by_admin_package',\n                    'business',\n                    (string)$scope['scope_ref'],\n                    ['package_key'=>(string)$package['package_key'],'assignment_ref'=>$publicId],\n                    (int)$admin['id']\n                );\n            }\n        }\n\n        coveted_audit(\n            'service_package.assigned',"
          if s.count(old) != 1:
              raise SystemExit(f'package activation transaction anchor count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          Path('.github/workflows/admin-partner-activation-patch.yml').unlink()
          PY
      - name: Commit lifecycle fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/service_packages.php .github/workflows/admin-partner-activation-patch.yml
          git commit -m "Activate partners on Admin package grants"
          git push origin HEAD:feature/entitlement-enforcement-upgrade-ux
