name: Member Onboarding Agent

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint onboarding PHP
        run: |
          php -l app/member_onboarding_agent.php
          php -l api/account-agent-bootstrap.php
          php -l api/account-agent-chat.php
          php -l scripts/verify-member-onboarding-agent.php

      - name: Verify Member Onboarding Agent contract
        run: php scripts/verify-member-onboarding-agent.php
