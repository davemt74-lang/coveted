name: Entitlement Service Patch

on:
  push:
    branches:
      - feature/entitlement-enforcement-upgrade-ux

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Bootstrap entitlement service hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/entitlement-enforcement-upgrade-ux
          fetch-depth: 0
      - name: Harden shared business reward and campaign services
        run: |
          python <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              s = p.read_text()
              for label, old, new in replacements:
                  count = s.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: anchor {label} count={count}')
                  s = s.replace(old, new, 1)
              p.write_text(s)

          patch('app/businesses.php', [
              ('access require',
               "require_once __DIR__ . '/bootstrap.php';\n",
               "require_once __DIR__ . '/bootstrap.php';\nrequire_once __DIR__ . '/entitlement_access.php';\n"),
              ('mutable entitlement',
               "    if (!coveted_business_actor_can_manage($actor, $businessId)) {\n        throw new InvalidArgumentException('You cannot manage this business.');\n    }\n\n    $stmt = coveted_db()->prepare('SELECT * FROM businesses WHERE id = ? LIMIT 1');",
               "    if (!coveted_business_actor_can_manage($actor, $businessId)) {\n        throw new InvalidArgumentException('You cannot manage this business.');\n    }\n    coveted_entitlement_require_business(\n        $actor,\n        $businessId,\n        'partner.workspace',\n        'Complete Partner setup or choose a package before changing this business.'\n    );\n\n    $stmt = coveted_db()->prepare('SELECT * FROM businesses WHERE id = ? LIMIT 1');")
          ])

          patch('app/rewards.php', [
              ('create business reward',
               "    if (!coveted_reward_actor_can_manage_owner($actor, $ownerType, $ownerId)) {\n        throw new InvalidArgumentException('You cannot create rewards for that owner.');\n    }\n\n    $title = trim((string)($data['title'] ?? ''));",
               "    if (!coveted_reward_actor_can_manage_owner($actor, $ownerType, $ownerId)) {\n        throw new InvalidArgumentException('You cannot create rewards for that owner.');\n    }\n    if ($ownerType === 'business') {\n        coveted_entitlement_require_business(\n            $actor, $ownerId, 'partner.offers',\n            'Your current partner package does not include business offers and rewards.'\n        );\n    }\n\n    $title = trim((string)($data['title'] ?? ''));"),
              ('reward status business gate',
               "        if (!coveted_reward_actor_can_manage_owner($actor, (string)$template['owner_type'], $ownerId)) {\n            throw new InvalidArgumentException('You cannot manage this reward.');\n        }\n        if ($status === 'active'",
               "        if (!coveted_reward_actor_can_manage_owner($actor, (string)$template['owner_type'], $ownerId)) {\n            throw new InvalidArgumentException('You cannot manage this reward.');\n        }\n        if ((string)$template['owner_type'] === 'business') {\n            coveted_entitlement_require_business(\n                $actor, $ownerId, 'partner.offers',\n                'Your current partner package does not include business offers and rewards.'\n            );\n        }\n        if ($status === 'active'"),
              ('reward media business gate',
               "    if (!coveted_reward_actor_can_manage_owner($actor, (string)$template['owner_type'], $ownerId)) {\n        throw new InvalidArgumentException('You cannot edit this reward.');\n    }\n\n    if (count($items) > 100)",
               "    if (!coveted_reward_actor_can_manage_owner($actor, (string)$template['owner_type'], $ownerId)) {\n        throw new InvalidArgumentException('You cannot edit this reward.');\n    }\n    if ((string)$template['owner_type'] === 'business') {\n        coveted_entitlement_require_business(\n            $actor, $ownerId, 'partner.offers',\n            'Your current partner package does not include business offers and rewards.'\n        );\n    }\n\n    if (count($items) > 100)")
          ])

          patch('app/campaigns.php', [
              ('campaign create business gate',
               "    if (!coveted_reward_actor_can_manage_owner($actor, $ownerType, $ownerId)) {\n        throw new InvalidArgumentException('You cannot create campaigns for that owner.');\n    }\n\n    $templateRef = trim((string)($data['reward_template'] ?? ''));",
               "    if (!coveted_reward_actor_can_manage_owner($actor, $ownerType, $ownerId)) {\n        throw new InvalidArgumentException('You cannot create campaigns for that owner.');\n    }\n    if ($ownerType === 'business') {\n        coveted_entitlement_require_business(\n            $actor, $ownerId, 'partner.campaigns',\n            'Your current partner package does not include campaign management.'\n        );\n    }\n\n    $templateRef = trim((string)($data['reward_template'] ?? ''));"),
              ('campaign status business gate',
               "        if (!coveted_reward_actor_can_manage_owner($actor, (string)$campaign['owner_type'], $ownerId)) {\n            throw new InvalidArgumentException('You cannot manage this campaign.');\n        }\n        if ($status === 'active')",
               "        if (!coveted_reward_actor_can_manage_owner($actor, (string)$campaign['owner_type'], $ownerId)) {\n            throw new InvalidArgumentException('You cannot manage this campaign.');\n        }\n        if ((string)$campaign['owner_type'] === 'business') {\n            coveted_entitlement_require_business(\n                $actor, $ownerId, 'partner.campaigns',\n                'Your current partner package does not include campaign management.'\n            );\n        }\n        if ($status === 'active')")
          ])

          # Make the empty business state match the self-service Partner flow.
          p = Path('business.php')
          s = p.read_text()
          old = "            <h2>No business assigned.</h2>\n            <p>A Coveted System Admin must assign your account as a Business Admin before you can manage business data.</p>\n            <a class=\"cv-text-link\" href=\"/profile.php\">Back to Profile →</a>"
          new = "            <h2>No partner business yet.</h2>\n            <p>Create a Partner account from your existing Coveted membership, or ask a System Admin to add you to an existing business.</p>\n            <div class=\"cv-action-row\"><a class=\"cv-button cv-button-primary\" href=\"/partner-onboarding.php\">Become a Partner</a><a class=\"cv-button cv-button-soft\" href=\"/profile.php\">Back to Profile</a></div>"
          if s.count(old) != 1:
              raise SystemExit(f'business.php empty-state anchor count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))

          Path('.github/workflows/entitlement-service-patch.yml').unlink()
          PY
      - name: Commit service hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/businesses.php app/rewards.php app/campaigns.php business.php .github/workflows/entitlement-service-patch.yml
          git commit -m "Harden partner entitlement service boundaries"
          git push origin HEAD:feature/entitlement-enforcement-upgrade-ux
