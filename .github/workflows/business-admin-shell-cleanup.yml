name: Clean Business Admin Shell Patch

on:
  push:
    branches:
      - fix/business-admin-shell
    paths:
      - '.github/workflows/business-admin-shell-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/business-admin-shell
          fetch-depth: 0

      - name: Correct selector-scoped CSS
        shell: python
        run: |
          from pathlib import Path

          path = Path('assets/css/coveted.css')
          css = path.read_text()

          def patch_block(selector, changes):
              global css
              start = css.find(selector)
              if start < 0:
                  raise SystemExit(f'Missing selector: {selector}')
              end = css.find('\n}', start)
              if end < 0:
                  raise SystemExit(f'Unclosed selector: {selector}')
              end += 2
              block = css[start:end]
              for old, new in changes:
                  if old not in block:
                      raise SystemExit(f'Missing expected declaration in {selector}: {old}')
                  block = block.replace(old, new, 1)
              css = css[:start] + block + css[end:]

          patch_block('.cv-distribution-form,\n.cv-claim-form {', [
              ('padding-top: 10px;', 'padding-top: 16px;'),
          ])

          patch_block('.cv-admin-sidebar {', [
              ('background: #171716;', 'background: #fff;'),
              ('color: #fff;', 'color: #171716;'),
          ])

          patch_block('.cv-admin-primary-nav a.is-active {', [
              ('background: #fff;', 'background: #171716;'),
              ('color: #171716;', 'color: #fff;'),
          ])

          patch_block('.cv-admin-sidebar-footer {', [
              ('padding-top: 16px;', 'padding-top: 10px;'),
          ])

          path.write_text(css)

      - name: Verify corrected CSS and PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Validate
        run: |
          set -euo pipefail
          php -l business.php
          python - <<'PY'
          from pathlib import Path
          css = Path('assets/css/coveted.css').read_text()
          assert '.cv-admin-sidebar {' in css
          sidebar = css.split('.cv-admin-sidebar {', 1)[1].split('\n}', 1)[0]
          assert 'background: #fff;' in sidebar
          assert 'color: #171716;' in sidebar
          active = css.split('.cv-admin-primary-nav a.is-active {', 1)[1].split('\n}', 1)[0]
          assert 'background: #171716;' in active
          assert 'color: #fff;' in active
          claim = css.split('.cv-distribution-form,\n.cv-claim-form {', 1)[1].split('\n}', 1)[0]
          assert 'padding-top: 16px;' in claim
          PY

      - name: Commit cleanup
        run: |
          set -euo pipefail
          rm -f .github/workflows/business-admin-shell-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Correct Admin sidebar selector styling'
          git push origin HEAD:fix/business-admin-shell
