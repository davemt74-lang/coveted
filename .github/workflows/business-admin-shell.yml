name: Patch Business Admin Shell

on:
  push:
    branches:
      - fix/business-admin-shell
    paths:
      - '.github/workflows/business-admin-shell.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/business-admin-shell
          fetch-depth: 0

      - name: Patch business shell and Admin sidebar
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing expected block: {label}')
              return text.replace(old, new, 1)

          business = Path('business.php')
          text = business.read_text()

          text = replace_once(
              text,
              "require_once __DIR__ . '/app/outcomes.php';\n",
              "require_once __DIR__ . '/app/outcomes.php';\nrequire_once __DIR__ . '/app/admin_ui.php';\n",
              'admin ui include'
          )

          text = replace_once(
              text,
              "coveted_page_start('Business');\n?>",
              "if ($isSystemAdmin) {\n    coveted_page_start('Business', '', true);\n    coveted_admin_ui_start(\n        $user,\n        'businesses',\n        $business ? (string)$business['name'] : 'Business Workspace'\n    );\n} else {\n    coveted_page_start('Business');\n}\n?>",
              'business page shell start'
          )

          text = replace_once(
              text,
              "    <?php coveted_page_end(); exit; ?>",
              "    <?php\n    if ($isSystemAdmin) {\n        coveted_admin_ui_end();\n    }\n    coveted_page_end();\n    exit;\n    ?>",
              'empty business shell close'
          )

          text = replace_once(
              text,
              "<?php coveted_page_end(); ?>",
              "<?php\nif ($isSystemAdmin) {\n    coveted_admin_ui_end();\n}\ncoveted_page_end();\n?>",
              'business page shell end'
          )

          business.write_text(text)

          css = Path('assets/css/coveted.css')
          styles = css.read_text()

          replacements = [
              ("    overflow-y: auto;\n    padding: 22px 16px 18px;\n    background: #171716;\n    color: #fff;",
               "    overflow-y: auto;\n    padding: 18px 14px 14px;\n    border-right: 1px solid #e1e1de;\n    background: #fff;\n    color: #171716;", 'sidebar surface'),
              ("    min-height: 48px;\n    padding: 0 10px 18px;\n    border-bottom: 1px solid rgba(255,255,255,.1);",
               "    min-height: 44px;\n    padding: 0 10px 12px;\n    border-bottom: 1px solid #e8e8e5;", 'brand spacing'),
              ("    color: rgba(255,255,255,.46);",
               "    color: #8a8a86;", 'brand small color'),
              ("    padding-top: 8px;",
               "    padding-top: 6px;", 'primary nav top'),
              ("    gap: 3px;\n    padding: 13px 0;\n    border-bottom: 1px solid rgba(255,255,255,.08);",
               "    gap: 2px;\n    padding: 8px 0;\n    border-bottom: 1px solid #ececea;", 'nav group spacing'),
              ("    padding: 0 10px 5px;\n    color: rgba(255,255,255,.36);",
               "    padding: 0 10px 3px;\n    color: #9a9a96;", 'nav label'),
              ("    gap: 10px;\n    min-height: 38px;\n    padding: 0 10px;\n    border-radius: 8px;\n    color: rgba(255,255,255,.68);\n    font-size: 12px;\n    font-weight: 680;",
               "    gap: 10px;\n    min-height: 32px;\n    padding: 0 10px;\n    border-radius: 7px;\n    color: #62625f;\n    font-size: 11.5px;\n    font-weight: 680;\n    line-height: 1.1;", 'nav link sizing'),
              ("    background: rgba(255,255,255,.07);\n    color: #fff;",
               "    background: #f3f3f1;\n    color: #171716;", 'nav hover'),
              ("    background: #fff;\n    color: #171716;",
               "    background: #171716;\n    color: #fff;", 'nav active'),
              ("    background: rgba(255,255,255,.08);\n    color: rgba(255,255,255,.62);",
               "    background: #efefec;\n    color: #747470;", 'nav badge'),
              ("    background: #e9e9e6;\n    color: #252524;",
               "    background: rgba(255,255,255,.14);\n    color: #fff;", 'active nav badge'),
              ("    padding-top: 16px;",
               "    padding-top: 10px;", 'sidebar footer spacing'),
              ("    padding: 10px;\n    border-radius: 8px;\n    color: rgba(255,255,255,.52);",
               "    padding: 8px 10px;\n    border-radius: 7px;\n    color: #7c7c78;", 'sidebar footer link'),
              ("    background: rgba(255,255,255,.06);\n    color: #fff;",
               "    background: #f3f3f1;\n    color: #171716;", 'sidebar footer hover'),
              ("        border: 1px solid rgba(255,255,255,.1);",
               "        border: 1px solid #e1e1de;", 'mobile nav border')
          ]

          for old, new, label in replacements:
              styles = replace_once(styles, old, new, label)

          css.write_text(styles)

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Verify changed source
        run: |
          set -euo pipefail
          php -l business.php
          grep -q "coveted_admin_ui_start" business.php
          grep -q "background: #fff;" assets/css/coveted.css
          grep -q "min-height: 32px;" assets/css/coveted.css

      - name: Commit product changes
        run: |
          set -euo pipefail
          rm -f .github/workflows/business-admin-shell.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use Admin shell for business workspace'
          git push origin HEAD:fix/business-admin-shell
