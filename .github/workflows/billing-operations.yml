name: Billing Operations & Reconciliation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint billing operations PHP
        run: |
          php -l app/billing_operations.php
          php -l admin/billing-operations.php
          php -l app/admin_ui.php
          php -l scripts/verify-billing-operations.php

      - name: Verify billing operations contract
        run: php scripts/verify-billing-operations.php
