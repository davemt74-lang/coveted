name: Service Packages & Billing

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint Service Packages & Billing PHP
        run: |
          php -l app/service_packages.php
          php -l billing.php
          php -l admin/service-packages.php
          php -l scripts/verify-service-packages.php

      - name: Verify Service Packages & Billing contract
        run: php scripts/verify-service-packages.php
